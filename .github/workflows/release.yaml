name: Release

# Push a tag like v1.3.0 to publish a release. The tag must match the
# manifest version and CHANGELOG.md must have a "## 1.3.0" section, which
# becomes the release notes.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        name: Compare tag, manifest and changelog
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest=$(jq -r .version custom_components/chipsea_scale/manifest.json)
          if [ "$tag" != "$manifest" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest version $manifest"
            exit 1
          fi
          if ! grep -qx "## $tag" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## $tag' section"
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"

  tests:
    needs: check
    uses: ./.github/workflows/tests.yaml

  validate:
    needs: check
    uses: ./.github/workflows/validate.yaml

  release:
    name: Publish release
    needs: [check, tests, validate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Extract release notes
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          awk -v header="## $VERSION" '
            $0 == header { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release_notes.md
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release_notes.md \
            --verify-tag
