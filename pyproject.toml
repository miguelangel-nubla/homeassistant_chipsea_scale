[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.coverage.run]
source = ["custom_components.chipsea_scale"]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["B", "D", "E", "F", "I", "PL", "RUF", "SIM", "UP", "W"]
ignore = ["D202", "D203", "D213", "E501", "PLR2004", "PLR0913"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D103", "PLC0415"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components.chipsea_scale"]
combine-as-imports = true
